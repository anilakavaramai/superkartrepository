services:
  backend:
    build:
      context: ./backend
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7860/')"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    ports:
      - "7860:7860"

  frontend:
    build:
      context: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_URL: http://backend:7860
    ports:
      - "8501:8501"
